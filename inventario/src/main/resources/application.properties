spring.devtools.restart.enabled=false
spring.application.name=inventario

# Menos bytes en JSON grandes (listados de periféricos del agente)
server.compression.enabled=true

# Orígenes del front permitidos por CORS (coma). En el servidor se puede sobreescribir con APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,https://agentebacar-inventario.web.app,https://agentebacar-inventario.firebaseapp.com
# Tras proxy HTTPS (p. ej. Cloud Run con terminación TLS): server.forward-headers-strategy=framework

# Firebase — JSON en disco (inventario/auth/), fuera de target
firebase.config.path=auth/serviceAccountKey.json
app.security.firebase-filter.enabled=true
firebase.collection.computadoras=computadoras
firebase.collection.camaras=camaras
# Subcolección bajo cada documento de computadora (agente → programas instalados)
firebase.subcollection.computadora-programas=programas
firebase.collection.routers=routers
firebase.collection.switches=switches
firebase.collection.maquinas_tesoreria=maquinas_tesoreria
firebase.collection.perifericos_manuales=perifericos_manuales
firebase.collection.usuarios=usuarios
firebase.collection.nvrs=nvrs


# Migración masiva a estado IT "Asignada" (todas las PCs y cámaras):
# - enabled=true: permite POST /api/admin/migracion/todas-asignada
# - run-on-startup=true: además ejecuta esa migración una vez al arrancar (requiere enabled=true)
app.migration.bulk-asignada.enabled=false
app.migration.bulk-asignada.run-on-startup=false

# Importación de cámaras desde classpath:data/camaras-activas.json (ID doc = nombreDispositivo; fallback id legacy)
# enabled=true → al arrancar el servidor
app.import.camaras-activas.enabled=false
# allow-http=true → permite POST /api/admin/import/camaras-activas sin reiniciar (solo entorno controlado)
app.import.camaras-activas.allow-http=true
app.import.maquinas-tesoreria.allow-http=true
