<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — BACARSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #0e0f36;
        --color-primary-hover: #23266b;
        --color-danger: #9c1313;
        --color-danger-hover: #af2222;
        --color-text: #202124;
        --color-text-secondary: #5f6368;
        --color-border: #c8cdd5;
        --color-sidebar-bar: #5c6bc0;
        --bg: #eef0f4;
        --card-bg: #ffffff;
        --shadow: rgba(14, 15, 54, 0.06);
        --shadow-lg: rgba(14, 15, 54, 0.10);
        --hover-bg: #f0f1f8;
        --radius: 8px;
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: var(--color-text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 720px;
        padding: 2rem 1.5rem;
      }

      .header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: -0.01em;
        margin-bottom: 0.35rem;
      }

      .header p {
        color: var(--color-text-secondary);
        font-size: 0.95rem;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25rem;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        border-left: 4px solid var(--color-sidebar-bar);
        padding: 1.75rem 1.5rem;
        text-decoration: none;
        color: inherit;
        transition: all var(--transition);
        box-shadow: 0 2px 12px var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px var(--shadow-lg);
        border-left-color: var(--color-primary);
      }

      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--radius);
        background: rgba(92, 107, 192, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.25rem;
      }

      .card-icon svg {
        color: var(--color-sidebar-bar);
      }

      .card-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--color-primary);
      }

      .card-desc {
        font-size: 0.88rem;
        color: var(--color-text-secondary);
      }

      .card-arrow {
        margin-top: 0.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-sidebar-bar);
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      @media (max-width: 480px) {
        .cards { grid-template-columns: 1fr; }
        .header h1 { font-size: 1.6rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Home BACARSA</h1>
        <p>Plataformas internas</p>
      </div>

      <div class="cards">
        <a class="card" href="https://bacar-cybersecurity.web.app/" target="_blank" rel="noopener">
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span class="card-title">CyberSecurity</span>
          <span class="card-desc">Panel de seguridad informática</span>
          <span class="card-arrow">Ir al sitio &rarr;</span>
        </a>

        <a class="card" href="https://agentebacar-inventario.web.app/" target="_blank" rel="noopener">
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <span class="card-title">Inventario</span>
          <span class="card-desc">Gestión de equipos e inventario IT</span>
          <span class="card-arrow">Ir al sitio &rarr;</span>
        </a>
      </div>
    </div>
  </body>
</html>
